<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.png" type="image/x-icon" />
    <title>Typewriter Entries</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <link rel="stylesheet" href="styles.css?v=2026-09-29-inline-labels" />
</head>
<body>
    <div class="paper">
        <div class="editor-field title-field">
            <p class="field-label" id="title-label">Title</p>
            <div class="entry-title" contenteditable="true" id="new-title" role="textbox" aria-labelledby="title-label"></div>
        </div>
        <div class="editor-field text-field">
            <p class="field-label" id="text-label">Text</p>
            <div class="typed-text" contenteditable="true" id="new-text" role="textbox" aria-labelledby="text-label" aria-multiline="true"></div>
        </div>
        <button class="save-button" type="button">Save entry</button>
        <p id="save-status" role="status" aria-live="polite"></p>
    </div>

    <div class="sidebar">
        <h2 class="saved-entries">Saved entries</h2>
        <ul class="saved-list" id="saved-list"></ul>
    </div>

    <div class="modal-overlay">
        <div class="modal" id="txt">
          <img class="typewriter_img" src="img/typewriter_img.jpg" alt="Typewriter">
            <h2 class="modal-title"></h2>
            <div class="modal-content"></div>
            <p class="modal-creation-date"></p>
            <button class="pdf-button" type="button">Download PDF</button>
            <p id="pdf-status" role="status" aria-live="polite"></p>
            <br>
            <br>
            <button class="modal-close" type="button">Close</button>
        </div>
    </div>

    <script type="text/javascript" src="js/jspdf.min.js?v=2.5.2"></script>
    <script type="text/javascript" src="js/pdfGenerator.js?v=2026-09-29-en"></script>
    <script type="text/javascript" src="js/firebase-config.js?v=2026-09-29-connected"></script>
    <script type="text/javascript" src="js/script.js?v=2026-09-29-inline-labels"></script>
</body>
</html>
